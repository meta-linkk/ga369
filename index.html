<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác minh</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:
        radial-gradient(circle at top,#203a67 0%,#0d1b32 42%,#070d18 100%);
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.notice{
    margin-bottom:14px;
    padding:16px 18px;
    text-align:center;
    line-height:1.45;
    font-size:15px;
    font-weight:600;
    color:#dbe7ff;
    background:rgba(78,118,255,.13);
    border:1px solid rgba(120,155,255,.25);
    border-radius:16px;
    backdrop-filter:blur(10px);
}

.card{
    padding:30px 24px 24px;
    background:rgba(17,31,55,.94);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.badge{
    width:54px;
    height:54px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:25px;
    background:linear-gradient(135deg,#3478ff,#7157ff);
    box-shadow:0 10px 30px rgba(55,105,255,.35);
}

.title{
    text-align:center;
    font-size:21px;
    font-weight:600;
    margin-bottom:10px;
}

.question{
    text-align:center;
    font-size:34px;
    font-weight:800;
    margin:18px 0 25px;
    letter-spacing:.3px;
}

input{
    width:100%;
    height:58px;
    padding:0 17px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.15);
    outline:none;
    background:#0b1729;
    color:#fff;
    font-size:20px;
    transition:.2s;
}

input::placeholder{
    color:#73829a;
}

input:focus{
    border-color:#5482ff;
    box-shadow:0 0 0 4px rgba(84,130,255,.13);
}

button{
    width:100%;
    height:58px;
    margin-top:14px;
    border:0;
    border-radius:13px;
    cursor:pointer;
    color:white;
    font-size:19px;
    font-weight:700;
    background:linear-gradient(90deg,#2877f5,#5268ff);
    box-shadow:0 10px 28px rgba(44,105,255,.28);
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

#error{
    min-height:22px;
    margin-top:14px;
    text-align:center;
    color:#ff8181;
    font-size:14px;
}

.footer{
    margin-top:8px;
    text-align:center;
    color:#75869f;
    font-size:12px;
}
</style>
</head>

<body>

<div class="container">

    <div class="notice">
        Bạn đang truy cập trang web<br>
        Vui lòng hoàn tất xác minh để tiếp tục
    </div>

    <div class="card">

        <div class="badge">✓</div>

        <div class="title">
            Xác minh bạn là con người
        </div>

        <div class="question">
            1 + 2 = Bao nhiêu?
        </div>

        <input
            id="answer"
            type="number"
            inputmode="numeric"
            placeholder="Nhập câu trả lời"
            autocomplete="off"
        >

        <button onclick="checkAnswer()">
            XÁC NHẬN
        </button>

        <div id="error"></div>

        <div class="footer">
            Xác minh nhanh • Bảo mật kết nối
        </div>

    </div>
</div>

<script>
function checkAnswer(){

    const answer =
        document.getElementById("answer").value.trim();

    if(answer === "3"){

        window.location.href =
        "https://TRANG-WEB-DICH-CUA-BAN.com";

    }else{

        document.getElementById("error").innerText =
        "Câu trả lời chưa đúng. Vui lòng thử lại.";

    }
}

document.getElementById("answer")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){
        checkAnswer();
    }

});
</script>

</body>
</html>
